name: Deployment smoke check
on:
  push:
    branches: [fix/deployment-smoke-check]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify real production account lifecycle on persistent storage
        run: |
          python3 - <<'PY'
          import json, secrets, uuid, time, urllib.request, urllib.error, http.cookiejar
          
          base = "https://geomatrix-exp2.vercel.app"
          origin = {"Origin": base, "Content-Type": "application/json"}
          
          def client():
              jar = http.cookiejar.CookieJar()
              return urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar)), jar
          
          def call(opener, path, body=None, expected=None):
              req = urllib.request.Request(base + path, data=None if body is None else json.dumps(body).encode(), headers=origin, method="GET" if body is None else "POST")
              try:
                  response = opener.open(req, timeout=90)
              except urllib.error.HTTPError as exc:
                  response = exc
              data = response.read()
              status = response.code
              parsed = json.loads(data) if data else None
              if expected is not None and status != expected:
                  raise AssertionError(path + " returned HTTP " + str(status) + ", expected " + str(expected))
              return status, parsed
          
          for attempt in range(20):
              probe, _ = client()
              status, payload = call(probe, "/api/auth/login", {"email": "probe-" + uuid.uuid4().hex + "@example.invalid", "password": "intentionally-wrong-deployment-test"})
              print("Persistent backend readiness:", status, flush=True)
              if status == 401:
                  break
              if status != 503:
                  raise AssertionError("Unexpected readiness response " + str(status))
              time.sleep(10)
          else:
              raise AssertionError("Persistent account service did not become ready")
          
          email = "geomatrix-verification-" + uuid.uuid4().hex + "@example.invalid"
          password = secrets.token_urlsafe(32)
          opener, jar = client()
          _, user = call(opener, "/api/auth/register", {"name": "GEOMATRIX automated verification", "email": email, "password": password}, 201)
          assert user["email"] == email and "token" not in user and "password" not in user
          session_cookie = next(cookie for cookie in jar if cookie.name == "geomatrix_session")
          assert session_cookie.secure and any(key.lower() == "httponly" for key in session_cookie._rest)
          _, me = call(opener, "/api/auth/me", expected=200)
          assert me["user"]["email"] == email
          call(opener, "/api/auth/logout", {}, 204)
          call(opener, "/api/auth/me", expected=401)
          fresh, fresh_jar = client()
          _, logged_in = call(fresh, "/api/auth/login", {"email": email, "password": password}, 200)
          assert logged_in["sub"] == user["sub"] and logged_in["email"] == email
          call(fresh, "/api/auth/me", expected=200)
          call(fresh, "/api/auth/logout", {}, 204)
          call(fresh, "/api/auth/me", expected=401)
          _, denied = call(fresh, "/api/auth/login", {"email": email, "password": "incorrect-verification-password"}, 401)
          assert isinstance(denied.get("error"), str)
          print("PASS: registration, secure cookie, session, logout, fresh password login, revocation, and wrong-password rejection")
          print("Verification sessions revoked; no credentials retained.")
          
          PY
