name: Login browser checks
on:
  push:
    branches: [main, fix/login-page, fix/password-auth]
    paths: ['app/login/**', 'lib/googleIdentity.ts', 'lib/passwordAuth.ts', 'lib/authErrors.ts', 'app/api/auth/**', 'tests/login-ui.test.mjs', '.github/workflows/login-ui.yml']
  pull_request:
    paths: ['app/login/**', 'lib/googleIdentity.ts', 'lib/passwordAuth.ts', 'lib/authErrors.ts', 'app/api/auth/**', 'tests/login-ui.test.mjs', '.github/workflows/login-ui.yml']
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start isolated login test server
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: test-client
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: 'true'
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/geomatrix-login-dev.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/geomatrix-login-dev.log
          exit 1
      - run: node --test tests/login-ui.test.mjs
      - name: Show server diagnostics after failure
        if: failure()
        run: cat /tmp/geomatrix-login-dev.log || true
