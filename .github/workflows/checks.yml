name: Regression checks
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:api
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'geomatrix_v2/requirements*.txt'
      - run: pip install -r geomatrix_v2/requirements-dev.txt
      - run: pytest -q
  postgres-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geomatrix
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: geomatrix_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U geomatrix -d geomatrix_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://geomatrix:isolated-test-password@127.0.0.1:5432/geomatrix_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'geomatrix_v2/requirements*.txt'
      - run: pip install -r geomatrix_v2/requirements-dev.txt
      - name: Verify persistent PostgreSQL account and session lifecycle
        run: pytest -q geomatrix_v2/tests/test_auth.py geomatrix_v2/tests/test_password_auth.py
